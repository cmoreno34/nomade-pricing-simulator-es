/* ============================================================
   MATEMÁTICAS
   ============================================================ */
function interpolateDemand(surveyData, price, demandPotential) {
  const sorted = [...surveyData].sort((a,b)=>a.price-b.price);
  const total = sorted.reduce((s,d)=>s+d.responses,0);
  let lo = 0, hi = sorted.length - 1;
  for (let i = 0; i < sorted.length; i++) {
    if (sorted[i].price <= price) lo = i;
    if (sorted[i].price >= price && hi === sorted.length - 1) hi = i;
  }
  if (lo === hi) {
    let cum = 0; for (let i = lo; i < sorted.length; i++) cum += sorted[i].responses;
    return demandPotential * (cum / total);
  }
  const p1 = sorted[lo], p2 = sorted[hi];
  let c1 = 0, c2 = 0;
  for (let i = lo; i < sorted.length; i++) c1 += sorted[i].responses;
  for (let i = hi; i < sorted.length; i++) c2 += sorted[i].responses;
  const f1 = c1/total, f2 = c2/total;
  const t = (price - p1.price) / (p2.price - p1.price);
  return demandPotential * (f1 + t * (f2 - f1));
}

function profitCurve(data, costs, period) {
  const min = Math.min(...data.map(d=>d.price));
  const max = Math.max(...data.map(d=>d.price));
  const step = (max-min)/60;
  const D0 = costs.D * DEMAND_MULT[period];
  const out = [];
  for (let p = min; p <= max; p += step) {
    const dem = interpolateDemand(data, p, D0);
    const rev = p * dem;
    const vc = costs.VC * dem;
    const prof = rev - vc - costs.FC;
    out.push({ price: Math.round(p*100)/100, demand: Math.round(dem), revenue: Math.round(rev), profit: Math.round(prof) });
  }
  return out;
}
const findPeak = curve => curve.reduce((m,c)=>c.profit>m.profit?c:m, curve[0]);

function wtpCumulative(data) {
  const sorted = [...data].sort((a,b)=>a.price-b.price);
  const total = sorted.reduce((s,d)=>s+d.responses,0);
  let cum = 0;
  return sorted.map(d => {
    cum += d.responses;
    return { price: d.price, responses: d.responses, pctAbove: (total - cum + d.responses)/total*100 };
  });
}

const prospectValue = (x, a=0.88, l=2.25) => x >= 0 ? Math.pow(x,a) : -l*Math.pow(-x,a);

function pctAccepting(data, p) {
  const total = data.reduce((s,d)=>s+d.responses,0);
  const accept = data.filter(d => d.price >= p).reduce((s,d)=>s+d.responses,0);
  return (accept/total)*100;
}

      prompt: 'Usando el marco de 4 escenarios de la nota técnica: (a) identifica qué escenario aplica a Nomade para cada versión (Estándar / Premium); (b) ¿es Popt > o < los precios de los competidores? (c) ¿la razón es la estructura de costes o la diferenciación? (d) según el escenario ¿debe Nomade aplicar penetración (−) / penetración agresiva (−−), descremado (+) / descremado rápido-agresivo (++) o no hacer nada? (e) justifícalo con teoría competitiva y el análisis de beneficios sobre la DAP.',
      hint: 'GUÍA DE RESPUESTA — Óptimos DAP: Std €80 · Prem €100. Rango competencia Std €85–€105, Prem (asumido) €95–€129 → Popt < C. Estructura de costes similar (ligeramente mejor gracias a la eficiencia del diseño sostenible); diferenciación OBJETIVAMENTE MAYOR pero RECONOCIMIENTO DE MARCA BAJO. Es el escenario b.3: Popt < C porque se percibe menos diferenciado pese a la superioridad real. RECOMENDACIÓN → DESCREMADO (+) en Premium (construir anclaje de marca) y PENETRACIÓN suave (−) en Estándar solo el primer año para sembrar prueba. Nunca penetración agresiva (−−) — quema margen sin cerrar la brecha de marca. Usa la pestaña Curva de beneficio para leer el beneficio en movimientos de +€5/+€10 antes de decidir.'
    },
    { id: 'Q3',
      title: 'Estrategia de precios fin de semana / semana',
      prompt: 'Los datos de competencia son SOLO diarios. (a) Empieza por las decisiones de precio diario (óptimo DAP + posicionamiento competitivo); (b) asume estándares de la industria para fin de semana (5–10 % de descuento por día) y semana (20–30 % de descuento total) para estimar las tarifas de competencia; (c) propón los precios de fin de semana / semana de Nomade; (d) usa anclaje (diario × 7 vs precio semanal); (e) construye un "sandwich" entre Estándar y Premium.',
      hint: 'GUÍA DE RESPUESTA — Usa fin de semana = −5 % por día (norma del sector para paquetes de 2 noches) y semana = −30 % por día (descuento de larga estancia). Nomade fin de semana Std → €75/día (€150 total), Prem → €95/día; semana Std → €60/día (€360 total), Prem → €77/día. Anclar el "precio semanal" mostrando el ahorro por día frente a la referencia "7 × diario" dentro del simulador. Usa Factores psicológicos → Anclaje: deja Básico = competidor más barato, Medio = Nomade Std, Premium = Nomade Prem y aplícalo a la posición. El gráfico combinado "Std+Prem × Día/Fin de semana/Semana" hace visible el sandwich 2 × 3 en una sola imagen.'
    },
    { id: 'Q4',
      title: 'Propuesta completa de precios',
      prompt: 'Entrega la estrategia final de precios con justificación completa: (a) tabla de precios completa (Estándar/Premium × Día/Fin de semana/Semana); (b) comparación frente a competidores (con tus supuestos de fin de semana/semana); (c) justificación — análisis DAP (curvas de beneficio), posicionamiento competitivo (diferenciación vs costes), tácticas psicológicas (anclaje, sandwich, charm); (d) resultados de negocio esperados (beneficio, posicionamiento de mercado); (e) considera estructuras alternativas (ej. 3 niveles con versión "enhanced"); (f) mitigación de riesgos (reacción de competidores).',
      hint: 'GUÍA DE RESPUESTA — Propuesta base: Std (Día €79 / Fin de semana €75/día / Semana €60/día), Prem (Día €99 / Fin de semana €95/día / Semana €77/día). Terminaciones charm €79 / €99 capturan el efecto del dígito 9 sin erosionar el margen. Resultados: ≈ 65 % de aceptación en Std, 40–50 % en Prem, brecha de −€5–€10 vs competidor medio, beneficio total > €80 k/año combinado. Riesgos: (i) los competidores bajan precio en el Std diario → comprometerse a un bloqueo de precio durante 6 meses + fidelización semana-al-precio-de-día; (ii) hándicap de reconocimiento de marca → potenciar el discurso de sostenibilidad; (iii) canibalización → mantener brecha Std–Prem ≥ 20 €. Rellena cada precio en Posición y precios, añade la nota del analista y descarga el Excel. Ese fichero ES la propuesta.'
    }
  ];

  const [downloading, setDownloading] = useState(false);
  const [downloadStatus, setDownloadStatus] = useState(null);

  const curSurvey = SURVEY[period][version];
  const curCosts  = COSTS[version];
  const curveStd  = useMemo(()=>profitCurve(SURVEY[period].standard, COSTS.standard, period), [period]);
  const curvePrem = useMemo(()=>profitCurve(SURVEY[period].premium,  COSTS.premium,  period), [period]);
  const peakStd   = useMemo(()=>findPeak(curveStd),  [curveStd]);
  const peakPrem  = useMemo(()=>findPeak(curvePrem), [curvePrem]);
  const curCurve  = version === 'standard' ? curveStd  : curvePrem;

  /* Los competidores tienen UN solo precio; ambos campos ver actualizan el mismo campo */
  const updateCompetitor = (comp, _ver, val) =>
    setCompetitors(prev => ({ ...prev, [period]: { ...prev[period], [comp]: { price: parseFloat(val)||0 } } }));
  const competitorPrice = (p, cKey) => compPrice(competitors[p][cKey]);

  /* En el gráfico competitivo, los competidores aparecen UNA vez (tarifa única), Nomade aparece con sus dos gamas. */
  const compData = [
    { name: 'Nomade Std',   price: ourPrices[period].standard, color: '#2563eb', isUs: true,  tier: 'Estándar' },
    { name: 'Nomade Prem',  price: ourPrices[period].premium,  color: '#f97316', isUs: true,  tier: 'Premium'  },
    ...COMP_META.map(c => ({ name: c.name, price: competitorPrice(period, c.k), color: c.color, isUs: false, tier: 'Tarifa única' }))
  ];
  /* Promedio de la tarifa única de competencia — usado para el KPI "brecha vs media" */
  const avgComp     = COMP_META.reduce((s,c) => s + competitorPrice(period, c.k), 0) / COMP_META.length;
  const avgCompStd  = avgComp;
  const avgCompPrem = avgComp;
  const gapStd  = ourPrices[period].standard - avgCompStd;
  const gapPrem = ourPrices[period].premium  - avgCompPrem;
  const pctAcceptStd  = pctAccepting(SURVEY[period].standard, ourPrices[period].standard);
  const pctAcceptPrem = pctAccepting(SURVEY[period].premium,  ourPrices[period].premium);

  /* Sincronizar los valores por defecto de los factores psicológicos con la posición actual de Nomade
     (solo cuando cambian periodo/versión o el usuario hace clic explícito en "Reset") */
  useEffect(() => {
    const ourStd  = ourPrices[period].standard;
    const ourPrem = ourPrices[period].premium;
    const compStdMin = Math.min(...COMP_META.map(c => competitorPrice(period, c.k)));
    setAnchorTier({ basic: compStdMin, mid: ourStd, premium: ourPrem });
    const rounded = ourStd;
    setCharmTest({ round: rounded, charm: rounded > 10 ? rounded - 1 : rounded });
    setRefPrice(compStdMin);
    setProspectFromTo({ from: ourStd, to: Math.round(ourStd * 1.1) });
    /* eslint-disable-next-line react-hooks/exhaustive-deps */
  }, [period, version, psychSynced]);

  /* Métricas en vivo en el "Nuestro precio" actual para la versión activa */
  const live = useMemo(() => {
    const ourP = ourPrices[period][version];
    const D0 = COSTS[version].D * DEMAND_MULT[period];
    const d = interpolateDemand(SURVEY[period][version], ourP, D0);
    const rev = ourP * d;
    const vc  = COSTS[version].VC * d;
    const prof = rev - vc - COSTS[version].FC;
    const peak = version === 'standard' ? peakStd : peakPrem;
    return {
      price: ourP,
      demand: Math.round(d),
      revenue: Math.round(rev),
      profit: Math.round(prof),
      lostVsPeak: Math.round(peak.profit - prof),
      peakPrice: peak.price
    };
  }, [ourPrices, period, version, peakStd, peakPrem]);

  /* ---------- Componentes de gráficos (aceptan w,h para que la copia offscreen pueda renderizar a tamaño fijo) ---------- */
  const wtpData = useMemo(() => {
    const cum = wtpCumulative(curSurvey);
    return curSurvey.map(d => ({ ...d, pctAbove: (cum.find(c=>c.price===d.price)||{}).pctAbove || 0 }));
  }, [curSurvey]);

  const WTPChart = ({h=320, w="100%"}) => (
    <ResponsiveContainer width={w} height={h}>
      <ComposedChart data={wtpData}>
        <CartesianGrid strokeDasharray="3 3" />
        <XAxis dataKey="price" />
        <YAxis yAxisId="l" />
        <YAxis yAxisId="r" orientation="right" />
        <Tooltip />
        <Legend />
        <Bar yAxisId="l" dataKey="responses" name="Respuestas" fill={version==='standard' ? '#3b82f6' : '#f97316'} />
        <Line yAxisId="r" type="monotone" dataKey="pctAbove" name="% acept. acumulada (≥ precio)" stroke="#10b981" strokeWidth={2} />
        <ReferenceLine yAxisId="l" x={ourPrices[period][version]} stroke="#f97316" strokeWidth={2} strokeDasharray="4 4" label={{ value:`Nuestro €${ourPrices[period][version]}`, fill:'#f97316', position:'top' }} />
      </ComposedChart>
    </ResponsiveContainer>
  );

  const ProfitChart = ({h=380, w="100%", interactive=false}) => {
    const [dragging, setDragging] = useState(false);
    useEffect(() => {
      if (!interactive) return;
      const up = () => setDragging(false);
      window.addEventListener('mouseup', up);
      return () => window.removeEventListener('mouseup', up);
    }, [interactive]);
    const snap = (val) => {
      /* ajustar al x más cercano de la curva para evitar saltos */
      let best = curCurve[0].price, dmin = Infinity;
      for (const p of curCurve) { const d = Math.abs(p.price - val); if (d < dmin) { dmin = d; best = p.price; } }
      return best;
    };
    const move = (e, forceStart=false) => {
      if (!interactive) return;
      if (e && e.activeLabel != null) {
        const v = snap(e.activeLabel);
        if (forceStart || dragging) {
          setOurPrices(prev => ({ ...prev, [period]: { ...prev[period], [version]: v } }));
        }
      }
    };
    return (
      <ResponsiveContainer width={w} height={h}>
        <LineChart data={curCurve}
          onMouseDown={(e) => { if (interactive && e?.activeLabel != null) { setDragging(true); move(e, true); } }}
          onMouseMove={(e) => move(e)}
          style={interactive ? { cursor: dragging ? 'grabbing' : 'crosshair' } : undefined}
        >
          <CartesianGrid strokeDasharray="3 3" />
          <XAxis dataKey="price" type="number" domain={['dataMin','dataMax']} label={{ value:'Precio (€)', position:'insideBottom', offset:-4 }} />
          <YAxis />
          <Tooltip formatter={v => `€${Number(v).toLocaleString()}`} />
          <Legend />
          <ReferenceLine x={peakStd.price}  stroke="#2563eb" strokeDasharray="5 5" label={{ value:`Std opt €${peakStd.price}`,  position:'top', fill:'#2563eb' }}/>
          <ReferenceLine x={peakPrem.price} stroke="#f97316" strokeDasharray="5 5" label={{ value:`Prem opt €${peakPrem.price}`, position:'top', fill:'#f97316' }}/>
          {COMP_META.map(c => (
            <ReferenceLine key={c.k} x={competitorPrice(period, c.k)} stroke={c.color} strokeDasharray="3 3"
              label={{ value: c.name, fill: c.color, position: 'insideTop', fontSize: 11 }} />
          ))}
          <ReferenceLine x={ourPrices[period][version]} stroke="#059669" strokeWidth={3}
            label={{ value: interactive ? `◉ Nuestro €${ourPrices[period][version]} — arrástrame` : `Nuestro €${ourPrices[period][version]}`, position:'bottom', fill:'#059669', fontSize: 12, fontWeight: 600 }}/>
          <Line type="monotone" dataKey="profit" stroke={version==='standard' ? '#3b82f6' : '#f97316'} strokeWidth={3} dot={false} name={version==='standard'?'Beneficio Estándar':'Beneficio Premium'} isAnimationActive={false} />
        </LineChart>
      </ResponsiveContainer>
    );
  };

  const DemandChart = ({h=300, w="100%"}) => (
    <ResponsiveContainer width={w} height={h}>
      <ComposedChart data={curCurve}>
        <CartesianGrid strokeDasharray="3 3" />
        <XAxis dataKey="price" />
        <YAxis yAxisId="l" />
        <YAxis yAxisId="r" orientation="right" />
        <Tooltip />
        <Legend />
        <Line yAxisId="l" type="monotone" dataKey="demand"  stroke="#2563eb" strokeWidth={2} dot={false} name="Demanda (alquileres)" />
        <Line yAxisId="r" type="monotone" dataKey="revenue" stroke="#f97316" strokeWidth={2} dot={false} name="Ingresos (€)" />
      </ComposedChart>
    </ResponsiveContainer>
  );

  const CompetitiveChart = ({h=360, w="100%"}) => (
    <ResponsiveContainer width={w} height={h}>
      <BarChart data={compData} margin={{top:20, right:30, left:0, bottom:60}}>
        <CartesianGrid strokeDasharray="3 3" />
        <XAxis dataKey="name" angle={-14} textAnchor="end" height={70} />
        <YAxis />
        <Tooltip formatter={(v,_n,p) => [`€${v}`, p?.payload?.tier || 'Precio']} />
        <Legend />
        <ReferenceLine y={peakStd.price}  stroke="#2563eb" strokeDasharray="5 5" label={{ value:`Std opt €${peakStd.price}`,  position:'insideTopRight', fill:'#2563eb', fontSize:11 }}/>
        <ReferenceLine y={peakPrem.price} stroke="#f97316" strokeDasharray="5 5" label={{ value:`Prem opt €${peakPrem.price}`, position:'insideBottomRight', fill:'#f97316', fontSize:11 }}/>
        <Bar dataKey="price" name="Precio (€)">
          {compData.map((e,i) => <Cell key={i} fill={e.color} opacity={e.isUs ? 1 : 0.85} />)}
        </Bar>
      </BarChart>
    </ResponsiveContainer>
  );

  /* ======================================================================
     Mapas de posicionamiento — Precio vs atributo percibido (Marca / Sostenibilidad / Diseño)
     ====================================================================== */
  const positioningData = (attr) => [
    { name: PROFILES.nomade.name,       x: PROFILES.nomade[attr],       y: ourPrices.day.standard,         color: PROFILES.nomade.color,       isUs: true,  size: PROFILES.nomade.size },
    { name: PROFILES.furtherVAN.name,   x: PROFILES.furtherVAN[attr],   y: competitorPrice('day','furtherVAN'),   color: PROFILES.furtherVAN.color,   isUs: false, size: PROFILES.furtherVAN.size },
    { name: PROFILES.peopleCamper.name, x: PROFILES.peopleCamper[attr], y: competitorPrice('day','peopleCamper'), color: PROFILES.peopleCamper.color, isUs: false, size: PROFILES.peopleCamper.size },
    { name: PROFILES.oceanVans.name,    x: PROFILES.oceanVans[attr],    y: competitorPrice('day','oceanVans'),    color: PROFILES.oceanVans.color,    isUs: false, size: PROFILES.oceanVans.size }
  ];

  const PositioningMap = ({ attrKey, attrLabel, h=340, w="100%", children }) => {
    const data = positioningData(attrKey);
    const yMin = Math.max(0, Math.min(...data.map(d=>d.y)) - 15);
    const yMax = Math.max(...data.map(d=>d.y)) + 20;
    return (
      <ResponsiveContainer width={w} height={h}>
        <ScatterChart margin={{top:20, right:60, bottom:50, left:20}}>
          <CartesianGrid strokeDasharray="3 3" />
          <XAxis type="number" dataKey="x" name={attrLabel} domain={[0,10]}
                 ticks={[0,2,4,6,8,10]}
                 label={{ value: attrLabel + ' (0–10)', position:'insideBottom', offset:-10, fontSize:12 }} />
          <YAxis type="number" dataKey="y" name="Precio"
                 domain={[yMin, yMax]}
                 label={{ value:'Precio diario (€)', angle:-90, position:'insideLeft', fontSize:12 }} />
          <Tooltip cursor={{strokeDasharray:'3 3'}}
                   formatter={(v,n) => n==='Precio' ? `€${v}` : `${v}/10`}
                   labelFormatter={() => ''} />
          {/* Un Scatter por punto para que cada uno tenga su color + etiqueta */}
          {data.map((d,i) => (
            <Scatter key={i} name={d.name} data={[d]} fill={d.color}>
              <LabelList dataKey="name" position="right" offset={10} style={{fontSize:11, fontWeight:600, fill:d.color}} />
            </Scatter>
          ))}
          {children}
        </ScatterChart>
      </ResponsiveContainer>
    );
  };

  const PositioningBrandChart   = (p) => <PositioningMap {...p} attrKey="brand"   attrLabel="Reconocimiento de marca" />;
  const PositioningSustainChart = (p) => <PositioningMap {...p} attrKey="sustain" attrLabel="Sostenibilidad" />;
  const PositioningDesignChart  = (p) => <PositioningMap {...p} attrKey="design"  attrLabel="Diseño / personalización" />;

  /* Gráfico combinado de posicionamiento — Std + Prem × Día / Fin de semana / Semana en UN solo gráfico,
     con la tarifa única de los competidores como líneas de referencia para el periodo activo. */
  const CombinedPositioningChart = ({h=380, w="100%"}) => {
    const data = PERIODS.map(p => ({
      period: p.label.split(' ')[0],
      'Nomade Estándar': ourPrices[p.k].standard,
      'Nomade Premium':  ourPrices[p.k].premium,
      'Further VAN':     competitorPrice(p.k, 'furtherVAN'),
      'People Camper':   competitorPrice(p.k, 'peopleCamper'),
      'Ocean Vans':      competitorPrice(p.k, 'oceanVans')
    }));
    return (
      <ResponsiveContainer width={w} height={h}>
        <BarChart data={data} margin={{top:30, right:30, left:0, bottom:10}}>
          <CartesianGrid strokeDasharray="3 3" />
          <XAxis dataKey="period" />
          <YAxis />
          <Tooltip formatter={v => `€${v}`} />
          <Legend wrapperStyle={{fontSize:'.82rem'}} />
          {/* Nomade — el sandwich de dos gamas */}
          <Bar dataKey="Nomade Estándar" fill="#2563eb" />
          <Bar dataKey="Nomade Premium"  fill="#f97316" />
          {/* Competidores — barras de referencia tarifa única en tonos grises */}
          <Bar dataKey="Further VAN"   fill="#93c5fd" />
          <Bar dataKey="People Camper" fill="#c4b5fd" />
          <Bar dataKey="Ocean Vans"    fill="#6ee7b7" />
        </BarChart>
      </ResponsiveContainer>
    );
  };

  const GapChart = ({h=300, w="100%"}) => {
    const data = COMP_META.map(c => ({ name: c.name,
      standardGap: ourPrices[period].standard - competitorPrice(period, c.k),
      premiumGap:  ourPrices[period].premium  - competitorPrice(period, c.k) }));
    return (
      <ResponsiveContainer width={w} height={h}>
        <BarChart data={data}>
          <CartesianGrid strokeDasharray="3 3" />
          <XAxis dataKey="name" />
          <YAxis />
          <ReferenceLine y={0} stroke="#0f172a" />
          <Tooltip />
          <Legend />
          <Bar dataKey="standardGap" name="Brecha Estándar vs competidor (€)" fill="#2563eb" />
          <Bar dataKey="premiumGap"  name="Brecha Premium vs competidor (€)"  fill="#f97316" />
        </BarChart>
      </ResponsiveContainer>
    );
  };

  const AnchorChart = ({h=260, w="100%"}) => {
    const data = [
      { name: 'Básico',            price: anchorTier.basic },
      { name: 'Medio (objetivo)',  price: anchorTier.mid },
      { name: 'Anclaje Premium',   price: anchorTier.premium }
    ];
    return (
      <ResponsiveContainer width={w} height={h}>
        <BarChart data={data}>
          <CartesianGrid strokeDasharray="3 3" />
          <XAxis dataKey="name" /><YAxis />
          <Tooltip formatter={v=>`€${v}`} />
          <Bar dataKey="price"><Cell fill="#94a3b8"/><Cell fill="#059669"/><Cell fill="#dc2626"/></Bar>
        </BarChart>
      </ResponsiveContainer>
    );
  };

  const CharmChart = ({h=260, w="100%"}) => {
    const left1 = Math.floor(charmTest.round/10);
    const left2 = Math.floor(charmTest.charm/10);
    const demandRound = interpolateDemand(curSurvey, charmTest.round, curCosts.D * DEMAND_MULT[period]);
    const boost = left2 < left1 ? 1.07 : 1.0;
    const demandCharm = interpolateDemand(curSurvey, charmTest.charm, curCosts.D * DEMAND_MULT[period]) * boost;
    const data = [
      { name: `€${charmTest.round} (redondo)`, demand: Math.round(demandRound), profit: Math.round(demandRound*(charmTest.round-curCosts.VC)-curCosts.FC) },
      { name: `€${charmTest.charm} (charm)`,   demand: Math.round(demandCharm), profit: Math.round(demandCharm*(charmTest.charm-curCosts.VC)-curCosts.FC) }
    ];
    return (
      <ResponsiveContainer width={w} height={h}>
        <BarChart data={data}>
          <CartesianGrid strokeDasharray="3 3" />
          <XAxis dataKey="name" /><YAxis yAxisId="l" /><YAxis yAxisId="r" orientation="right" />
          <Tooltip /><Legend />
          <Bar yAxisId="l" dataKey="demand" name="Demanda esperada" fill="#2563eb" />
          <Bar yAxisId="r" dataKey="profit" name="Beneficio (€)"    fill="#f97316" />
        </BarChart>
      </ResponsiveContainer>
    );
  };

  const ProspectChart = ({h=280, w="100%"}) => {
    const delta = prospectFromTo.to - prospectFromTo.from; /* €, desde la perspectiva del cliente: +ve = descuento, -ve = subida */
    const customerChange = -delta; /* "ganancia" (descuento) o "pérdida" (subida) del cliente vs referencia */
    const xMax = Math.max(50, Math.ceil(Math.abs(customerChange) * 1.2));
    const pts = [];
    for (let x = -xMax; x <= xMax; x += Math.max(1, Math.round(xMax/30))) pts.push({ gainLoss: x, value: Math.round(prospectValue(x)*100)/100 });
    const vChange = prospectValue(customerChange);
    const vEqualGain = customerChange < 0 ? Math.abs(vChange) : null; /* qué tamaño de ganancia haría falta para compensar */
    return (
      <ResponsiveContainer width={w} height={h}>
        <LineChart data={pts}>
          <CartesianGrid strokeDasharray="3 3" />
          <XAxis dataKey="gainLoss" type="number" domain={[-xMax, xMax]} label={{ value:'Ganancia (+) o pérdida (−) del cliente vs referencia (€)', position:'insideBottom', offset:-4, fontSize:11 }} />
          <YAxis label={{ value:'Valor percibido', angle:-90, position:'insideLeft', fontSize:11 }} />
          <ReferenceLine x={0} stroke="#0f172a" /><ReferenceLine y={0} stroke="#0f172a" />
          <Tooltip />
          <Line type="monotone" dataKey="value" stroke="#7c3aed" strokeWidth={3} dot={false} name="v(x)" isAnimationActive={false} />
          <ReferenceLine x={customerChange} stroke={delta>0 ? '#059669' : '#dc2626'} strokeWidth={2} strokeDasharray="5 5"
            label={{ value: `Δ €${delta>=0?'+':''}${delta} → percibido ${Math.round(vChange*10)/10}`, fill: delta>0 ? '#059669' : '#dc2626', position:'top', fontSize:11 }} />
        </LineChart>
      </ResponsiveContainer>
    );
  };

  const ReferenceChart = ({h=260, w="100%"}) => {
    const below = curSurvey.filter(d => d.price <  refPrice).reduce((s,d)=>s+d.responses,0);
    const at    = curSurvey.filter(d => d.price === refPrice).reduce((s,d)=>s+d.responses,0);
    const above = curSurvey.filter(d => d.price >  refPrice).reduce((s,d)=>s+d.responses,0);
    const data = [
      { name: `Por debajo de €${refPrice}`, value: below, fill:'#dc2626' },
      { name: `En €${refPrice}`,            value: at,    fill:'#f59e0b' },
      { name: `Por encima de €${refPrice}`, value: above, fill:'#059669' }
    ];
    return (
      <ResponsiveContainer width={w} height={h}>
        <BarChart data={data}>
          <CartesianGrid strokeDasharray="3 3" />
          <XAxis dataKey="name" /><YAxis />
          <Tooltip />
          <Bar dataKey="value">{data.map((d,i)=><Cell key={i} fill={d.fill} />)}</Bar>
        </BarChart>
      </ResponsiveContainer>
    );
  };

  const svgToPngDataUrl = async (svgEl, scale = 2) => {
    const clone = svgEl.cloneNode(true);
    const w = svgEl.clientWidth  || svgEl.getBoundingClientRect().width  || 860;
    const h = svgEl.clientHeight || svgEl.getBoundingClientRect().height || 380;
    clone.setAttribute('width',  w);
    clone.setAttribute('height', h);
    clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    const xml = new XMLSerializer().serializeToString(clone);
    const b64 = btoa(unescape(encodeURIComponent(xml)));
    const img = new Image();
    img.src = 'data:image/svg+xml;base64,' + b64;
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; });
    const canvas = document.createElement('canvas');
    canvas.width  = w * scale;
    canvas.height = h * scale;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.scale(scale, scale);
    ctx.drawImage(img, 0, 0, w, h);
    return canvas.toDataURL('image/png');
  };

              const customerFelt = Math.round(prospectValue(-d) * 10)/10;
              return (
                <div className="explain" style={{borderLeftColor: d>0 ? '#dc2626' : '#059669', background: d>0 ? '#fef2f2' : '#ecfdf5'}}>
                  {d === 0 ? (<>Sin cambio — nada percibido.</>) : d > 0 ? (
                    <>Estás <strong>subiendo el precio en €{d}</strong>. El cliente lo percibe como una pérdida de ≈ <strong>{Math.abs(customerFelt)}</strong> unidades de valor. Para compensarla harías falta una ganancia de ≈ <strong>€{Math.round(Math.abs(d)*2.25*10)/10}</strong> — o, mejor, <em>reformular la subida como un descuento que se retira</em>.</>
                  ) : (
                    <>Estás <strong>bajando el precio en €{Math.abs(d)}</strong>. El cliente percibe una ganancia de ≈ <strong>{customerFelt}</strong> unidades de valor. Recuerda: las ganancias se sienten con menos intensidad que las pérdidas del mismo tamaño.</>
                  )}
                </div>
              );
            })()}
            <div className="row" style={{marginTop:10}}>
              <button className="btn primary" onClick={()=>setOurPrices(prev=>({...prev,[period]:{...prev[period], standard: prospectFromTo.to}}))}>Aplicar €{prospectFromTo.to} → Nuestro Estándar</button>
              <button className="btn orange"  onClick={()=>setOurPrices(prev=>({...prev,[period]:{...prev[period], premium: prospectFromTo.to}}))}>Aplicar €{prospectFromTo.to} → Nuestro Premium</button>
            </div>
          </div>
        )}

        {psychGraphs.includes('reference') && (
          <div className="card">
            <h3>Precio de referencia</h3>
            <div className="explain orange">
              <strong>Idea:</strong> los clientes comparan nuestro precio con un benchmark mental (competidor más barato, tarifa del año pasado, etc.). Fija la referencia y observa cuántos encuestados quedan <em>por debajo</em>, <em>en</em> o <em>por encima</em> de ella.
              <br/><strong>Por defecto:</strong> competidor más barato en el periodo activo.
            </div>
            <div className="grid-2">
              <div style={{maxWidth:260}}>
                <label>Precio de referencia (€)</label>
                <input type="number" value={refPrice} onChange={e=>setRefPrice(+e.target.value)} />
              </div>
              <div style={{alignSelf:'end'}}>
                {COMP_META.map(c => (
                  <button key={c.k} className="btn" style={{borderColor:c.color, color:c.color, marginRight:6}}
                    onClick={()=>setRefPrice(competitorPrice(period, c.k))}>
                    Usar {c.name} €{competitorPrice(period, c.k)}
                  </button>
                ))}
              </div>
            </div>
            <div style={{marginTop:12}}><ReferenceChart /></div>
            <div className="row" style={{marginTop:10}}>
              <button className="btn primary" onClick={()=>setOurPrices(prev=>({...prev,[period]:{...prev[period], standard: refPrice}}))}>Igualar referencia €{refPrice} → Nuestro Estándar</button>
              <button className="btn orange"  onClick={()=>setOurPrices(prev=>({...prev,[period]:{...prev[period], premium: refPrice}}))}>Igualar referencia €{refPrice} → Nuestro Premium</button>
            </div>
          </div>
        )}
      </>)}

      {/* ----- Pestaña: Posición y precios ----- */}
      {tab==='position' && (<>
        <div className="card">
          <h2>Posiciona el precio en el gráfico — {periodLabel} • {version}</h2>
          <div className="explain green">
            <strong>Arrastra la línea verde.</strong> Cada input numérico se sincroniza automáticamente. Líneas discontinuas = los tres competidores en su precio actual; azul/naranja discontinuas = óptimo de beneficio Estándar / Premium.
          </div>
          <ProfitChart interactive={true} h={360} />
          <div className="grid-4" style={{marginTop:14}}>
            <KPI label={`Beneficio a €${live.price}`} value={`€${live.profit.toLocaleString()}`} color={live.profit>=0?'green':'red'} />
            <KPI label="Demanda esperada" value={`${live.demand.toLocaleString()} alquileres`} color="blue" />
            <KPI label="Ingresos" value={`€${live.revenue.toLocaleString()}`} color="orange" />
            <KPI label={`Perdido vs óptimo (€${live.peakPrice})`} value={live.lostVsPeak===0 ? '€0 (¡óptimo!)' : `−€${live.lostVsPeak.toLocaleString()}`} color={live.lostVsPeak===0?'green':'red'} />
          </div>
        </div>

        <div className="card">
          <h2>Inputs numéricos — todos los periodos</h2>
          <p className="note">Estos son los precios que <strong>tú</strong> quieres proponer. Viajan con la exportación a Excel para que puedas compartir o comparar escenarios.</p>
          <div className="grid-3">
            {PERIODS.map(p => (
              <div key={p.k} className="box-soft">
                <h3>{p.label}</h3>
                <label>Estándar (€)</label>
                <input type="number" value={ourPrices[p.k].standard} onChange={e=>setOurPrices(prev=>({...prev,[p.k]:{...prev[p.k],standard:+e.target.value}}))}/>
                <label style={{marginTop:8}}>Premium (€)</label>
                <input type="number" value={ourPrices[p.k].premium}  onChange={e=>setOurPrices(prev=>({...prev,[p.k]:{...prev[p.k],premium:+e.target.value}}))}/>
              </div>
            ))}
          </div>
        </div>

        <div className="card">
          <h2>Precios de competidores — {periodLabel}</h2>
          <p className="note">
            Los competidores ofrecen <strong>una sola gama</strong> (sin desdoble Estándar / Premium) y publican <strong>solo tarifas diarias</strong>.
            Los valores de fin de semana / semana son una proyección de referencia (≈ −5 % / −30 % por día). Actualízalos si tienes mejor información.
          </p>
          <div className="grid-3">
            {COMP_META.map(c => (
              <div key={c.k} className="box-soft" style={{borderColor:c.color}}>
                <h3 style={{color:c.color}}>{c.name}</h3>
                <label>Tarifa diaria — gama única (€)</label>
                <input type="number" value={competitorPrice(period, c.k)} onChange={e=>updateCompetitor(c.k,'price',e.target.value)}/>
              </div>
            ))}
          </div>
        </div>

        <div className="card">
          <h2>Nota del analista</h2>
          <p className="note">Texto libre — razonamiento, supuestos, alineamiento con stakeholders, etc. Viaja dentro del Excel.</p>
          <textarea rows="4" value={positionNote} onChange={e=>setPositionNote(e.target.value)}
            placeholder="ej. Hemos decidido situarnos €5 por debajo de People Camper para abrir el segmento de fin de semana."/>
        </div>
      </>)}

      {/* ----- Pestaña: Respuestas del caso ----- */}
      {tab==='answers' && (<>
        <div className="card">
          <h2>Entregables del caso — las cuatro preguntas formales (Nomade v3.0)</h2>
          <div className="explain">
            Estas son las cuatro preguntas formales del caso Nomade Vans (v3.0). Escribe tu respuesta debajo — todo lo que escribas aquí se guarda con la sesión y se <strong>exporta al Excel descargado</strong> en una hoja dedicada "Respuestas del caso", junto con tu posición, los precios de competidores y todos los gráficos.
          </div>
          <p className="note">Usa las pestañas interactivas (Basado en competencia, Factores psicológicos, Posición y precios) para producir la evidencia y luego resúmela aquí.</p>
        </div>

        {CASE_QUESTIONS.map((q, idx) => (
          <div className="card" key={q.id}>
            <h3 style={{color:'#f97316'}}>{q.id} — {q.title}</h3>
            <div className="explain orange"><strong>Enunciado:</strong> {q.prompt}</div>
            <div className="explain"><strong>Pista del simulador:</strong> {q.hint}</div>
            <label style={{marginTop:8}}>Tu respuesta</label>
            <textarea rows={idx===0 ? 8 : 10}
              value={caseAnswers[q.id.toLowerCase()]}
              onChange={e => setCaseAnswers(prev => ({...prev, [q.id.toLowerCase()]: e.target.value}))}
              placeholder={`Responde a ${q.id} aquí — el texto viaja a tu descarga de Excel.`} />
            <p className="hint">{caseAnswers[q.id.toLowerCase()].length} caracteres · auto-guardado en la sesión.</p>
          </div>
        ))}

        <div className="card">
          <h3>Cuando estés listo</h3>
          <p className="note">Ve a <strong>Descargar Excel</strong> para obtener el .xlsx con tus respuestas, posición y gráficos. El fichero contendrá una hoja adicional llamada <em>Respuestas del caso</em>.</p>
        </div>
      </>)}

      {/* ----- Pestaña: Descargar Excel ----- */}
      {tab==='download' && (
        <div className="card">
          <h2>Descargar — el fichero Excel es el entregable completo</h2>
          <div className="explain green">
            <strong>Entrega solo este fichero.</strong> No hace falta documento Word ni presentación. El <code>.xlsx</code> contiene toda la evidencia: contexto del caso, preguntas, respuestas agregadas, tu posición final, tus respuestas escritas del caso y los nueve gráficos como imagen.
          </div>
          <p className="note">
            8 hojas — se abre nativamente en Excel, Numbers, Google Sheets y LibreOffice.
          </p>
          <div className="grid-2">
            <div className="box-soft">
              <h3>Qué hay dentro del fichero — 8 hojas</h3>
              <ul style={{margin:'4px 0 0 18px', padding:0}}>
                <li><strong>Guía</strong> — contexto del caso, nota de datos y vista activa</li>
                <li><strong>Preguntas</strong> — las 13 preguntas de la encuesta (solo referencia)</li>
                <li><strong>Respuestas — Día / Fin de semana / Semana</strong> — tablas DAP agregadas</li>
                <li><strong>Posición</strong> — tus precios, competidores, KPIs, parámetros psicológicos, nota del analista</li>
                <li><strong>Respuestas del caso</strong> — tus respuestas escritas a las tres preguntas formales</li>
                <li><strong>Gráficos</strong> — los 9 gráficos del simulador como imágenes embebidas</li>
              </ul>
            </div>
            <div className="box-soft">
              <h3>Antes de descargar</h3>
              <p className="note">Los gráficos del fichero reflejan el <strong>estado actual</strong> del simulador — periodo activo, versión, precios de competencia e inputs psicológicos. Elige primero la vista que quieras y luego haz clic en descargar.</p>
              <button className="btn primary" onClick={buildExcel} disabled={downloading}>
                {downloading ? 'Generando…' : 'Descargar Excel (.xlsx)'}
              </button>
              {downloadStatus && <div className={`status ${downloadStatus.kind==='err'?'err':downloadStatus.kind==='ok'?'ok':''}`}>{downloadStatus.text}</div>}
            </div>
          </div>
        </div>
      )}

      {/* ----- Pestaña: Entregable PDF (para Blackboard) ----- */}
      {tab==='deliver' && (
        <>
          <div className="card" style={{background:'#f5f3ff', borderColor:'#7c3aed'}}>
            <h2 style={{color:'#5b21b6'}}>📄 Entregable PDF — subir a Blackboard</h2>
            <p className="note" style={{color:'#5b21b6'}}>
              Rellena tu nombre y grupo, revisa que la <em>Nota del analista</em> y las <em>4 respuestas del caso</em> estén completas, y descarga el PDF. Ese fichero es el entregable que subes a la tarea de Blackboard.
            </p>
          </div>

          <div className="card">
            <h3>Datos del alumno</h3>
            <div className="grid-2">
              <div>
                <label>Nombre y apellidos</label>
                <input type="text" value={student.name} onChange={e=>setStudent({...student, name:e.target.value})} placeholder="ej. María García López"/>
              </div>
              <div>
                <label>Grupo / curso</label>
                <input type="text" value={student.group} onChange={e=>setStudent({...student, group:e.target.value})} placeholder="ej. 3º Grado Marketing · Grupo B"/>
              </div>
            </div>
          </div>

          <div className="card">
            <h3>Checklist antes de descargar</h3>
            <div className="grid-2">
              <div className="box-soft">
                <h4 style={{margin:'0 0 6px'}}>Precios finales</h4>
                <table style={{fontSize:'.85rem'}}>
                  <thead><tr><th>Periodo</th><th>Std</th><th>Prem</th></tr></thead>
                  <tbody>
                    {PERIODS.map(p => (
                      <tr key={p.k}><td>{p.label}</td><td>€{ourPrices[p.k].standard}</td><td>€{ourPrices[p.k].premium}</td></tr>
                    ))}
                  </tbody>
                </table>
              </div>
              <div className="box-soft">
                <h4 style={{margin:'0 0 6px'}}>Completitud</h4>
                <ul style={{margin:'4px 0 0 18px', padding:0, fontSize:'.88rem', lineHeight:1.7}}>
                  <li>Nombre: {student.name ? '✔' : '✗ falta'}</li>
                  <li>Grupo: {student.group ? '✔' : '✗ falta'}</li>
                  <li>Nota del analista: {positionNote ? '✔' : '✗ falta (pestaña Posición y precios)'}</li>
                  <li>Respuesta Q1: {caseAnswers.q1 ? `✔ (${caseAnswers.q1.length} car.)` : '✗ falta'}</li>
                  <li>Respuesta Q2: {caseAnswers.q2 ? `✔ (${caseAnswers.q2.length} car.)` : '✗ falta'}</li>
                  <li>Respuesta Q3: {caseAnswers.q3 ? `✔ (${caseAnswers.q3.length} car.)` : '✗ falta'}</li>
                  <li>Respuesta Q4: {caseAnswers.q4 ? `✔ (${caseAnswers.q4.length} car.)` : '✗ falta'}</li>
                </ul>
              </div>
            </div>
          </div>

          <div className="card" style={{background:'#ecfdf5', borderColor:'#059669'}}>
            <h3 style={{color:'#065f46'}}>Descargar el PDF</h3>
            <p className="note" style={{color:'#065f46'}}>Formato A4, varias páginas: portada con tus datos, contexto del caso, tabla 2×3 de precios, comparación con la competencia, KPIs, nota del analista y las 4 respuestas formales.</p>
            <button className="btn" style={{background:'#7c3aed', color:'#fff', borderColor:'#7c3aed'}} onClick={buildPDF} disabled={pdfBuilding}>
              {pdfBuilding ? 'Generando…' : '📄 Descargar PDF (entregable)'}
            </button>
            {pdfStatus && <div className={`status ${pdfStatus.kind==='err'?'err':pdfStatus.kind==='ok'?'ok':''}`} style={{marginLeft:10}}>{pdfStatus.text}</div>}
            <p className="hint" style={{marginTop:10}}>Si falta alguna respuesta o la nota del analista, el PDF se genera igualmente pero esas secciones aparecerán como "(sin respuesta)" o "(sin nota)".</p>
          </div>
        </>
      )}

      {/* Gráficos offscreen — la fuente de las capturas PNG que se incluyen en el Excel */}
      <div className="offscreen" aria-hidden="true">
        {CHART_CATALOG.map(c => (
          <div key={c.k} id={'cap-'+c.k} style={{width:860, height:380, background:'#fff', padding:8}}>
            <c.C h={360} w={844} />
          </div>
        ))}
      </div>

      <div className="footer">© César Moreno Pascual PhD — Simulador de precios Nomade Vans • Construido con React + Recharts + ExcelJS</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
